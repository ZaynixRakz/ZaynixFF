name: iOS Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate project
        run: |
          xcodebuild -project ZaynixFF.xcodeproj -list

      - name: Clean
        run: |
          xcodebuild             -project ZaynixFF.xcodeproj             -scheme ZaynixFF             -configuration Release             -sdk iphoneos             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             clean

      - name: Build iOS app
        run: |
          xcodebuild             -project ZaynixFF.xcodeproj             -scheme ZaynixFF             -configuration Release             -sdk iphoneos             -destination 'generic/platform=iOS'             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/output/build"             build

      - name: Package unsigned app
        run: |
          test -d "$GITHUB_WORKSPACE/output/build/ZaynixFF.app"
          cd "$GITHUB_WORKSPACE/output/build"
          zip -r "$GITHUB_WORKSPACE/ZaynixFF-unsigned.zip" ZaynixFF.app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZaynixFF-iOS-build
          path: ZaynixFF-unsigned.zip
          
